name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build and run the archetype integration test
        run: ./mvnw --batch-mode --no-transfer-progress verify
